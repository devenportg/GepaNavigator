services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gepa
      POSTGRES_USER: gepa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gepa_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gepa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://gepa:${POSTGRES_PASSWORD:-gepa_dev_password}@db:5432/gepa
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      INTEGRATION_KEY: ${INTEGRATION_KEY:-gis-demo-key}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
